<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
        <div class="navbar-container">
            <a href="#" class="navbar-logo">Fantasy World</a>
            <ul class="navbar-menu">
                <li><a href="#quests" class="navbar-link">Квесты</a></li>
                <li><a href="#hero" class="navbar-link">Цены</a></li>
                <li><a href="#reviews" class="navbar-link">Отзывы</a></li>
                <li><a href="#contact" class="navbar-link">Контакты</a></li>
            </ul>
    <button class="burger" id="burger">
    <span></span>
    <span></span>
    <span></span>
    </button>
        </div>
    </nav>
 <header class="hero">
     <div class="hero-container">
         <h1 class="hero-title">Fantasy World</h1>
         <p class="hero-subtitle">Погрузитесь в увлекательный мир настольных игр</p>
         <a class="hero-btn" href="#">подобрать свою игру</a>
        </div>
    </header>
    <section class="catalog" id="ctalog">
        <div class="catalog-grid" id="catalog-grid">
        

        </div>
</section>

<!-- ====== МОДАЛЬНОЕ ОКНО ТОВАРА ====== -->
<!-- Оверлей (фон) — затемняет страницу и центрирует окно -->
<div class="modal-overlay" id="product-modal">
    <!-- Само окно с содержимым -->
    <div class="modal-content">
        <!-- Кнопка закрытия (крестик) -->
        <button class="modal-close" id="modal-close">&times;</button>

        <!-- Галерея (левая колонка) -->
        <div class="modal-gallery">
            <!-- Большое изображение -->
            <img src="" alt="" id="modal-main-img" class="modal-main-img">
            <!-- Контейнер для миниатюр (будет заполнен через JS) -->
            <div class="modal-thumbnails" id="modal-thumbnails"></div>
        </div>

        <!-- Информация о товаре (правая колонка) -->
        <div class="modal-info">
            <!-- Название игры -->
            <h2 class="modal-title" id="modal-title"></h2>

            <!-- Мета-данные (игроки, возраст) -->
            <div class="modal-meta">
                <span id="modal-players"></span>
                <span id="modal-age"></span>
            </div>

            <!-- Полное описание -->
            <p class="modal-description" id="modal-description"></p>

            <!-- Цена -->
            <div class="modal-price" id="modal-price"></div>

            <!-- Кнопка "В корзину" -->
            <button class="product-card-btn modal-add-btn" id="modal-add-btn">В корзину</button>

            <!-- Ссылки на обзор и правила -->
            <div class="modal-links">
                <a href="#" target="_blank" id="modal-review" class="modal-link">🎬 Обзор игры</a>
                <a href="#" target="_blank" id="modal-rules" class="modal-link">📖 Как играть</a>
            </div>
        </div>
    </div>
</div>
 <script src="js/catalog.js"></script>      
 <!-- <script src="js/common.js"></script> -->
</body>
</html>
